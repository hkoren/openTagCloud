<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>openTagCloud layout fixture</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #box {
        width: 600px;
        height: 300px;
        display: flex; /* .otc-cloud stretches to the box via flex: 1 1 auto */
      }
    </style>
  </head>
  <body>
    <div id="box"><div id="cloud"></div></div>
    <script type="module">
      import { renderTagCloud, estimateCloudHeight } from '/core/index.js';

      const params = new URLSearchParams(location.search);
      const n = Number(params.get('n') || 24);
      const fill = params.get('fill') || undefined;
      const incremental = params.has('incremental');
      const density = params.has('density')
        ? Number(params.get('density'))
        : undefined;
      const fillFactor = params.has('fillFactor')
        ? Number(params.get('fillFactor'))
        : undefined;
      if (params.get('dir') === 'rtl') document.documentElement.dir = 'rtl';
      if (params.has('auto'))
        document.getElementById('box').style.height = 'auto';

      const longNames = [
        'JavaScript',
        'TypeScript',
        'WebAssembly',
        'Kubernetes',
        'PostgreSQL',
        'Elasticsearch',
        'Microservices',
        'Observability',
        'Accessibility',
        'Documentation',
        'Infrastructure',
        'Authentication',
      ];
      const items = Array.from({ length: n }, (_, i) => ({
        label: params.has('long')
          ? `${longNames[i % longNames.length]}${Math.floor(i / longNames.length) || ''}`
          : `tag${i}`,
        weight: ((i * 37) % 100) + 1,
        href: params.has('click') ? undefined : `#t${i}`,
      }));

      window.clicks = [];
      window.cloud = renderTagCloud(document.getElementById('cloud'), items, {
        fill,
        incremental,
        density,
        fillFactor,
        // ?click makes non-link tags buttons and records activations
        onTagClick: params.has('click')
          ? (item) => window.clicks.push(item.label)
          : undefined,
      });
      if (params.has('unsafe')) {
        // attacker-shaped tag data: a script URL and a color that tries to
        // append its own declaration (see #35/#36)
        window.cloud.update([
          ...items.slice(0, 3),
          { label: 'evil', weight: 60, href: 'javascript:window.__pwned=1' },
          {
            label: 'leak',
            weight: 50,
            color: 'red;background-image:url(/__exfil.png)',
          },
        ]);
      }
      window.estimate = (w) => estimateCloudHeight(items, w);
      window.addOne = () =>
        window.cloud.update([...items, { label: 'newcomer', weight: 50 }]);
      window.reweightOne = () => {
        const next = items.map((t, i) => (i === 3 ? { ...t, weight: 99 } : t));
        window.cloud.update(next);
      };
      window.boxes = () =>
        [...document.querySelectorAll('.otc-tag')].map((el) => ({
          key: el.dataset.key,
          x: el.offsetLeft,
          y: el.offsetTop,
          w: el.offsetWidth,
          h: el.offsetHeight,
          position: getComputedStyle(el).position,
        }));
      window.setBox = (w, h) => {
        const box = document.getElementById('box');
        box.style.width = `${w}px`;
        box.style.height = `${h}px`;
      };
    </script>
  </body>
</html>
