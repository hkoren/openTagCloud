name: Release to npm

# Unattended publishing: push a v* tag and every package goes out.
#
#   git tag v0.4.2 && git push origin v0.4.2
#
# Authentication, in order of preference:
#   1. Trusted publishing (OIDC) — nothing to store. Configure each package on
#      npmjs.com → package → Settings → Trusted publisher → GitHub Actions with
#      organization "hkoren", repository "openTagCloud", workflow
#      "release.yml", environment blank (this job defines none). Fields are
#      case-sensitive. `id-token: write` below lets npm mint short-lived
#      credentials, and provenance attestations are then automatic.
#   2. A granular access token in the NPM_TOKEN repository secret, used when
#      trusted publishing isn't configured for a package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_verify:
        description: 'Skip the lint/build/check/test pipeline'
        type: boolean
        default: false
      dist_tag:
        description: 'npm dist-tag (use "next" for prereleases so latest is untouched)'
        type: string
        default: latest

permissions:
  contents: read
  id-token: write # required for trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job-level so the token-configuration step can test it in `if:` —
    # a step's own `env:` block is not visible to that step's condition.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Node 24 for npm >= 11.5.1: trusted publishing (OIDC) needs it, and
      # Node 22 still bundles npm 10.9.x. The explicit upgrade keeps this true
      # even if the runner image changes, and the echo makes it visible in logs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node -v && npm -v
      - run: npm ci

      # Token auth (skipped when the secret is absent, e.g. pure trusted
      # publishing). Written to the USER npmrc so it applies no matter which
      # package directory npm publishes from — packages/angular/dist would not
      # see a repo-root .npmrc.
      - name: Configure npm token
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm config set //registry.npmjs.org/:_authToken="$NPM_TOKEN" --location=user

      - name: Install Playwright Chromium
        if: ${{ !inputs.skip_verify }}
        run: npx playwright install --with-deps chromium

      - name: Publish
        run: |
          npm run release -- --yes \
            --tag "${{ inputs.dist_tag || 'latest' }}" \
            ${{ inputs.skip_verify && '--skip-verify' || '' }}
